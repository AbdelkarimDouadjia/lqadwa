name: Release checks
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm run install:ci
      - run: npm run check
      - name: Emulator runner failure-control regressions (no device)
        run: node scripts/android-runner-smoke.mjs
      - name: Discovery unit and scale regression (local SQLite)
        run: npm run test:discovery
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Install isolated browser-test engines
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:ocr
      - run: npm run test:ai-safety
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-checks
          path: .cloudflare/e2e/
          include-hidden-files: true # Only isolated synthetic browser artifacts in this exact directory.
          retention-days: 7
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.13'
      # The pinned runner already includes this SDK; sdkmanager is not on PATH.
      - name: Verify installed Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - run: gradle -p android assembleRelease assembleDebug assembleDebugAndroidTest lintRelease --console=plain --no-daemon
      - name: Run native instrumentation on an isolated API 34 emulator
        timeout-minutes: 12
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          # Headless QEMU still links libpulse; it is absent on this runner image.
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libpulse0
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'platform-tools' 'system-images;android-34;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name lqadwa-ci --package 'system-images;android-34;google_apis;x86_64'
          bash scripts/android-instrumentation.sh
      - name: Preserve emulator and instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-instrumentation
          path: |
            .cloudflare/android-instrumentation/*.log
            .cloudflare/android-instrumentation/*.txt
          retention-days: 7
      # CI APKs are unsigned: never publish them as distribution packages.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-release.*
          retention-days: 7
