name: Release checks
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm run install:ci
      - run: npm run check
      - name: Offline assistant retrieval, security and provider fallback checks
        run: npm run test:assistant
      - name: Discovery unit and scale regression (local SQLite)
        run: npm run test:discovery
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Install isolated browser-test engines
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$source" ]; then
              sudo sed -i \
                -e 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                -e 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' "$source"
            fi
          done
          npx --no-install playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:ocr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-checks
          path: .cloudflare/e2e/
          include-hidden-files: true # Only isolated synthetic browser artifacts in this exact directory.
          retention-days: 7
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.13'
      # The pinned runner already includes this SDK; sdkmanager is not on PATH.
      - name: Verify installed Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - run: gradle -p android assembleRelease assembleDebugAndroidTest lintRelease --console=plain --no-daemon
      # CI APKs are unsigned: never publish them as distribution packages.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-release.*
          retention-days: 7
