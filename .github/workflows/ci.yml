name: Release checks
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm run install:ci
      - run: npm run check
      - name: Discovery unit and scale regression (local SQLite)
        run: npm run test:discovery
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Install isolated browser-test engines
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:ocr
      - run: npm run test:ai-safety
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-checks
          path: .cloudflare/e2e/
          include-hidden-files: true # Only isolated synthetic browser artifacts in this exact directory.
          retention-days: 7
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.13'
      # The pinned runner already includes this SDK; sdkmanager is not on PATH.
      - name: Verify installed Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - run: gradle -p android assembleRelease assembleDebug assembleDebugAndroidTest lintRelease --console=plain --no-daemon
      - name: Run native instrumentation on an isolated API 34 emulator
        timeout-minutes: 12
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-34;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name lqadwa-ci --package 'system-images;android-34;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd lqadwa-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/lqadwa-emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for attempt in $(seq 1 120); do
            if test "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1; then break; fi
            sleep 2
          done
          test "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1
          "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82
          "$ANDROID_HOME/platform-tools/adb" install -r android/app/build/outputs/apk/debug/app-x86_64-debug.apk
          "$ANDROID_HOME/platform-tools/adb" install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          "$ANDROID_HOME/platform-tools/adb" shell am instrument -w dz.lqidwa.pilot.design.test/dz.lqidwa.pilot.NativeDesignTest > /tmp/lqadwa-instrumentation.log
          cat /tmp/lqadwa-instrumentation.log
          grep -q 'PASS: native screens' /tmp/lqadwa-instrumentation.log
          grep -q 'INSTRUMENTATION_CODE: -1' /tmp/lqadwa-instrumentation.log
          if grep -q 'FAIL:' /tmp/lqadwa-instrumentation.log; then exit 1; fi
      # CI APKs are unsigned: never publish them as distribution packages.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-release.*
          retention-days: 7
