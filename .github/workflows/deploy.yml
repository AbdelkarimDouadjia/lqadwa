name: Publish approved web release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-web
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm run install:ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run test:integration
      - run: npm run test:ocr
      # Fixture overrides are only CLI flags in local checks, never production environment variables.
      # Migrations and Android signing remain deliberate owner-controlled release steps.
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --import ./scripts/sites-env.mjs ./node_modules/wrangler/wrangler-dist/cli.js deploy --config dist/server/wrangler.json
      - run: node scripts/public-release-check.mjs
