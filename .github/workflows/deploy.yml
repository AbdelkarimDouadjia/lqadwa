name: Publish approved web release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Approved operating mode
        type: choice
        default: INFORMATION_ONLY
        options: [INFORMATION_ONLY, CORE]
permissions:
  contents: read
concurrency:
  group: production-web
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Check deployment credentials before release work
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPROVAL: ${{ vars.LQADWA_RELEASE_APPROVAL }}
        run: test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT" && test -n "$APPROVAL"
      - run: npm run install:ci
      - run: npm run check
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:ocr
      - run: npm run test:ai-safety
      - name: Verify operator approval and live migration history (read only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LQADWA_RELEASE_APPROVAL: ${{ vars.LQADWA_RELEASE_APPROVAL }}
        run: node scripts/release-preflight.mjs '${{ inputs.mode }}'
      # Fixture overrides are only CLI flags in local checks, never production environment variables.
      # Migrations and Android signing remain deliberate owner-controlled release steps.
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --import ./scripts/sites-env.mjs ./node_modules/wrangler/wrangler-dist/cli.js deploy --config dist/server/wrangler.json --keep-vars --var 'RELEASE_MODE:${{ inputs.mode }}' --var HEALTH_PROFILE_COLLECTION:false --var PRESCRIPTION_AI_ENABLED:false --var GROUNDED_ASSISTANT_ENABLED:false
      - run: node scripts/public-release-check.mjs
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
