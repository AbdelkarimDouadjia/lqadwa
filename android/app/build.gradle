plugins { id 'com.android.application' }
android {
    namespace 'dz.luqya.pilot'
    compileSdk 34
    defaultConfig { applicationId 'dz.luqya.pilot'; minSdk 23; targetSdk 34; versionCode 1; versionName '0.9.0-demo' }
    // Pilot-only signing. Use a dedicated upload key before Play Store release.
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
